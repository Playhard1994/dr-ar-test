<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
      #overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: black; display: flex; align-items: center; justify-content: center; z-index: 999;
      }
      button {
        padding: 20px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <button id="btn">คลิกเพื่อเริ่ม (อนุญาตกล้อง)</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: false;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="vid" src="video.mp4" webkit-playsinline playsinline muted loop="true"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#vid" width="1" height="0.56"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const btn = document.querySelector("#btn");
      const sceneEl = document.querySelector('a-scene');
      const video = document.querySelector("#vid");

      btn.addEventListener('click', () => {
        // 1. ซ่อนปุ่ม
        document.querySelector("#overlay").style.display = "none";
        
        // 2. บังคับขอสิทธิกล้องและเริ่มระบบ
        sceneEl.systems["mindar-image-system"].start();
        
        // 3. ปลดล็อควิดีโอ (iOS ต้องการการกระตุ้นจาก User)
        video.play();
        video.pause();
        console.log("AR Started");
      });

      // เมื่อสแกนเจอ ให้เล่นวิดีโอ (และเปิดเสียงถ้าต้องการ)
      const target = document.querySelector('[mindar-image-target]');
      target.addEventListener("targetFound", () => {
        video.muted = false; // เปิดเสียงตอนสแกนเจอ
        video.play();
      });
      target.addEventListener("targetLost", () => {
        video.pause();
      });
    </script>
  </body>
</html>
