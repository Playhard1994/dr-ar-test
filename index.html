<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8">
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      /* หน้าจอ Loading และปุ่มกด */
      #overlay {
        position: absolute; z-index: 1000; width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.7); color: white; font-family: sans-serif;
      }
      #start-btn {
        padding: 15px 30px; font-size: 1.2rem; cursor: pointer;
        border: none; border-radius: 50px; background: #007bff; color: white;
      }
    </style>
  </head>

  <body>
    <div id="overlay">
      <button id="start-btn">เปิดกล้องส่อง AR</button>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="myVideo" src="./video.mp4" webkit-playsinline playsinline loop="true"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-video src="#myVideo" width="1" height="0.56" position="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      const startBtn = document.querySelector("#start-btn");
      const overlay = document.querySelector("#overlay");
      const video = document.querySelector("#myVideo");
      const targetEntity = document.querySelector("#target");

      // เมื่อคลิกปุ่ม Start
      startBtn.addEventListener('click', () => {
        overlay.style.display = "none"; // ซ่อนหน้าจอสีดำ
        sceneEl.systems["mindar-image-system"].start(); // เริ่มทำงานกล้อง
      });

      // ตรวจจับเมื่อส่องเจอภาพ (Target Found)
      targetEntity.addEventListener("targetFound", () => {
        console.log("พบภาพเป้าหมาย!");
        video.play(); // สั่งวิดีโอเล่น
      });

      // ตรวจจับเมื่อดึงกล้องออก (Target Lost)
      targetEntity.addEventListener("targetLost", () => {
        console.log("เป้าหมายหายไป");
        video.pause(); // สั่งวิดีโอหยุด
      });
    </script>
  </body>
</html>
