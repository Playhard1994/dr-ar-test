<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta charset="utf-8">
    <title>My Web AR Video</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; }
      /* หน้าจอ Loading */
      #ui-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8); color: white; z-index: 10000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: sans-serif;
      }
      #start-btn {
        padding: 15px 40px; font-size: 1.2rem; cursor: pointer;
        background: #28a745; color: white; border: none; border-radius: 10px;
        margin-top: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      }
      #status-text { font-size: 0.9rem; color: #aaa; margin-top: 10px; }
    </style>
  </head>

  <body>
    <div id="ui-overlay">
      <div id="loading-msg">ระบบกำลังเตรียมการ...</div>
      <button id="start-btn" style="display: none;">กดเพื่อเริ่มส่อง AR</button>
      <div id="status-text">สถานะ: กำลังโหลด Library...</div>
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiScanning: #ui-scanning;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="arVideo" src="video.mp4" preload="auto" webkit-playsinline playsinline loop="true"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target0" mindar-image-target="targetIndex: 0">
        <a-video src="#arVideo" width="1" height="0.56" position="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <div id="ui-scanning" style="display: none;"></div>

    <script>
      const sceneEl = document.querySelector('a-scene');
      const startBtn = document.querySelector("#start-btn");
      const overlay = document.querySelector("#ui-overlay");
      const statusText = document.querySelector("#status-text");
      const loadingMsg = document.querySelector("#loading-msg");

      // 1. เช็คว่าโหลด Scene เรียบร้อยไหม
      sceneEl.addEventListener('loaded', () => {
        statusText.innerText = "สถานะ: พร้อมทำงาน";
        loadingMsg.style.display = "none";
        startBtn.style.display = "block";
      });

      // 2. เมื่อกดปุ่มเริ่ม
      startBtn.addEventListener('click', () => {
        overlay.style.display = "none";
        // เริ่มระบบกล้อง
        sceneEl.systems["mindar-image-system"].start();
        console.log("AR System Started");
      });

      // 3. ตรวจสอบเมื่อสแกนพบ/หลุด
      const targetEntity = document.querySelector("#target0");
      const video = document.querySelector("#arVideo");

      targetEntity.addEventListener("targetFound", () => {
        console.log("พบภาพเป้าหมาย!");
        video.play().catch(e => console.log("Video play failed:", e));
      });

      targetEntity.addEventListener("targetLost", () => {
        console.log("ไม่พบภาพเป้าหมาย");
        video.pause();
      });

      // 4. ดัก Error ถ้าเปิดกล้องไม่ได้ หรือไฟล์หาย
      sceneEl.addEventListener("arError", (event) => {
        statusText.innerText = "Error: " + event.detail.error;
        alert("เกิดข้อผิดพลาด: " + event.detail.error);
      });
    </script>
  </body>
</html>
