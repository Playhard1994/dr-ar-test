<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <div id="click-to-start" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5);">
      <button style="padding: 20px; font-size: 18px; cursor: pointer;">คลิกเพื่อเริ่มสแกน AR</button>
    </div>

    <a-scene mindar-image="imageTargetSrc: targets.mind;" vr-mode-ui="enabled: false" filterMinCF:0.001; filterBeta: 0.01; device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="myVideo" src="video.mp4" webkit-playsinline playsinline loop="true" muted></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-video src="#myVideo" position="0 0 0" height="0.56" width="1" rotation="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const startBtn = document.querySelector('#click-to-start');
      const sceneEl = document.querySelector('a-scene');
      const video = document.querySelector('#myVideo');
      const targetEntity = document.querySelector('#target');

      // เริ่มทำงานเมื่อกดปุ่ม
      startBtn.addEventListener('click', () => {
        startBtn.style.display = 'none';
        sceneEl.systems["mindar-image-system"].start();
      });

      // สั่งให้วิดีโอเล่นเมื่อสแกนเจอ และเปิดเสียง
      targetEntity.addEventListener("targetFound", () => {
        video.muted = false; // เปิดเสียง
        video.play();
      });

      // สั่งให้วิดีโอหยุดเมื่อดึงกล้องออก
      targetEntity.addEventListener("targetLost", () => {
        video.pause();
      });
    </script>
  </body>
</html>
